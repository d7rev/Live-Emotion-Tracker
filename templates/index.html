<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emotion Detection - VIT Bhopal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        
        h1 {
            color: white;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .subtitle {
            color: rgba(255,255,255,0.9);
            margin-bottom: 30px;
            font-size: 1.1em;
        }
        
        .container {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            max-width: 900px;
            width: 100%;
        }
        
        .video-container {
            position: relative;
            width: 100%;
            border-radius: 10px;
            overflow: hidden;
            background: #000;
        }
        
        #videoFeed {
            width: 100%;
            display: block;
            border-radius: 10px;
        }
        
        .emotions-panel {
            margin-top: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
        }
        
        .emotions-panel h3 {
            color: #333;
            margin-bottom: 15px;
        }
        
        .emotion-item {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
        }
        
        .emotion-label {
            width: 100px;
            font-weight: 600;
            color: #555;
            text-transform: capitalize;
        }
        
        .emotion-bar-container {
            flex: 1;
            height: 25px;
            background: #e0e0e0;
            border-radius: 12px;
            overflow: hidden;
            margin-right: 10px;
        }
        
        .emotion-bar {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            border-radius: 12px;
            transition: width 0.3s ease;
            width: 0%;
        }
        
        .emotion-value {
            width: 50px;
            text-align: right;
            font-weight: bold;
            color: #667eea;
        }
        
        .status {
            margin-top: 15px;
            padding: 10px;
            background: #e8f5e9;
            border-radius: 5px;
            color: #2e7d32;
            text-align: center;
        }
        
        .controls {
            margin-top: 20px;
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        
        button {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        .btn-secondary {
            background: #f5f5f5;
            color: #333;
        }
        
        .btn-secondary:hover {
            background: #e0e0e0;
        }
    </style>
</head>
<body>
    <h1>🎭 Emotion Detection System</h1>
    <p class="subtitle">Optimized HUD - VIT Bhopal</p>
    
    <div class="container">
        <div class="video-container">
            <img id="videoFeed" src="/video_feed" alt="Video Feed">
        </div>
        
        <div class="emotions-panel">
            <h3>Current Emotions</h3>
            <div class="emotion-item">
                <span class="emotion-label">Happy</span>
                <div class="emotion-bar-container">
                    <div class="emotion-bar" id="bar-happy"></div>
                </div>
                <span class="emotion-value" id="value-happy">0%</span>
            </div>
            <div class="emotion-item">
                <span class="emotion-label">Sad</span>
                <div class="emotion-bar-container">
                    <div class="emotion-bar" id="bar-sad"></div>
                </div>
                <span class="emotion-value" id="value-sad">0%</span>
            </div>
            <div class="emotion-item">
                <span class="emotion-label">Angry</span>
                <div class="emotion-bar-container">
                    <div class="emotion-bar" id="bar-angry"></div>
                </div>
                <span class="emotion-value" id="value-angry">0%</span>
            </div>
            <div class="emotion-item">
                <span class="emotion-label">Surprise</span>
                <div class="emotion-bar-container">
                    <div class="emotion-bar" id="bar-surprise"></div>
                </div>
                <span class="emotion-value" id="value-surprise">0%</span>
            </div>
            <div class="emotion-item">
                <span class="emotion-label">Neutral</span>
                <div class="emotion-bar-container">
                    <div class="emotion-bar" id="bar-neutral"></div>
                </div>
                <span class="emotion-value" id="value-neutral">0%</span>
            </div>
        </div>
        
        <div class="status" id="status">
            ✅ System Ready - Camera Active
        </div>
        
        <div class="controls">
            <button class="btn-primary" onclick="location.reload()">🔄 Refresh Page</button>
            <button class="btn-secondary" onclick="toggleFullscreen()">⛶ Fullscreen</button>
        </div>
    </div>
    
    <script>
        function updateEmotions() {
            fetch('/get_emotions')
                .then(response => response.json())
                .then(data => {
                    const emotions = ['happy', 'sad', 'angry', 'surprise', 'neutral'];
                    emotions.forEach(emo => {
                        const value = data[emo] || 0;
                        document.getElementById(`bar-${emo}`).style.width = value + '%';
                        document.getElementById(`value-${emo}`).textContent = Math.round(value) + '%';
                    });
                    document.getElementById('status').textContent = '✅ Analyzing emotions in real-time...';
                })
                .catch(error => {
                    console.error('Error fetching emotions:', error);
                    document.getElementById('status').textContent = '⚠️ Waiting for analysis...';
                });
        }
        
        // Update emotions every second
        setInterval(updateEmotions, 1000);
        
        function toggleFullscreen() {
            const container = document.querySelector('.video-container');
            if (!document.fullscreenElement) {
                container.requestFullscreen().catch(err => {
                    alert('Error attempting to enable fullscreen: ' + err.message);
                });
            } else {
                document.exitFullscreen();
            }
        }
        
        // Initial update
        updateEmotions();
    </script>
</body>
</html>
